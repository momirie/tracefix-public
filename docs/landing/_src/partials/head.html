<script>
  // Before first paint: mark JS, and apply the theme: Dark unless the visitor saved Light or System.
  (function () {
    var d = document.documentElement, t = 'dark'; d.className = 'js';
    try { var saved = localStorage.getItem('tracefix-theme'); if (saved === 'light' || saved === 'system') t = saved; } catch (e) {}
    d.setAttribute('data-theme', t);
    // Fail-safe: site.css hides the reveal blocks until site.js shows them. If site.js fails to load
    // (its onerror) or has not started the reveals in 2.5 s, show every block as it is.
    function showAll() {
      if (d.classList.contains('reveals-on')) return;
      var all = document.querySelectorAll('[data-reveal],[data-words],[data-reveal-group],.hero');
      for (var i = 0; i < all.length; i++) all[i].classList.add('is-in');
    }
    window.tracefixShowAll = showAll;
    setTimeout(showAll, 2500);
  })();
</script>
