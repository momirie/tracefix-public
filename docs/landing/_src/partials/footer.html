
<footer class="band ink foot">
  <div class="frame">
    <img src="{{root}}assets/logo-reversed.svg" alt="Tracefix" width="100" height="36">
    <nav aria-label="Footer">
      <a href="{{root}}#levels">Evidence levels</a>
      <a href="{{root}}benchmark/">Benchmark</a>
      <a href="{{root}}receipts/">Receipts</a>
      <a href="{{root}}method/">Method</a>
      <a href="{{root}}talk/">Talk to me</a>
      <a href="{{root}}talk/#feedback">Report a wrong receipt</a>
      <a href="https://github.com/momirie/tracefix">GitHub (after release)</a>
      <span>MIT licence</span>
    </nav>
    <div class="theme" role="group" aria-label="Colour theme">
      <button type="button" data-theme-pick="system" aria-pressed="false" aria-label="System theme" title="System theme"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M5.5 14h5M8 11.5V14"/></svg></button>
      <button type="button" data-theme-pick="light" aria-pressed="false" aria-label="Light theme" title="Light theme"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3"/></svg></button>
      <button type="button" data-theme-pick="dark" aria-pressed="true" aria-label="Dark theme" title="Dark theme"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5a5.8 5.8 0 1 0 7.1 7.1Z"/></svg></button>
    </div>
  </div>
</footer>

<!-- The command palette (Ctrl or Cmd + K, or "/"): site.js fills it from the entries below
     (scripts/site_palette.py) and shows the buttons that open it. -->
<dialog id="palette" class="palette" aria-label="Search this site" data-root="{{root}}">
  <div class="pal-top">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg>
    <input id="pal-in" type="text" role="combobox" aria-expanded="true" aria-controls="pal-list" aria-autocomplete="list" aria-label="Search pages, receipts and sections" placeholder="Search pages, receipts and sections" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button type="button" class="pal-close" data-palette-close>Esc</button>
  </div>
  <ul id="pal-list" class="pal-list" role="listbox" aria-label="Results"></ul>
  <p id="pal-none" class="pal-none" role="status" hidden>Nothing matches. Try a fixture name, a level or a page.</p>
  <p class="pal-foot" aria-hidden="true"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></p>
</dialog>
<script type="application/json" id="palette-data">{{palette_data}}</script>
<script src="{{root}}assets/site.js" onerror="tracefixShowAll()"></script>
{{scripts}}</body>
</html>
