<main id="main" tabindex="-1" class="page">
<!-- NOT FOUND: the page a host serves for an address that does not exist (404.html at the site's
     root). It can be served at any depth, so every link on it starts at "/" (the root hole is "/"
     here: scripts/build_site.py, Page.not_found). -->
<section class="page-head">
  <div class="frame">
    <p class="eyebrow">Not found</p>
    <h1 data-words>No page at this address. <span class="soft">The link is wrong, or the page has moved.</span></h1>
    <p class="lede" data-reveal style="--d:3">Nothing on this site lives here. Check the address for a typo, or start again from one of the pages that exist.</p>
    <div class="talk-ctas" data-reveal style="--d:4">
      <a class="btn" href="{{root}}">Home</a>
      <a class="btn-ghost" href="{{root}}receipts/">Receipts</a>
      <a class="btn-ghost" href="{{root}}benchmark/">Benchmark</a>
      <a class="btn-ghost" href="{{root}}method/">Method</a>
    </div>
  </div>
</section>
</main>
